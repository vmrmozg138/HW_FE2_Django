{% extends 'catalog/base.html' %}

{% block content %}
  <div class="container py-4">
    <h1 class="display-6 fw-bold text-dark mb-4 border-bottom pb-2">Удаление продукта</h1>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="alert alert-warning p-3 mb-3 rounded">
            <strong>Внимание:</strong> Вы действительно хотите удалить продукт «{{ object.name }}»?
            <br><small class="text-muted">Это действие нельзя отменить.</small>
          </div>

          <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
            Удалить
          </button>
        </form>

        <p class="mt-3">
          <a href="{% url 'catalog:products' %}" class="text-decoration-none">
            ← Вернуться к списку
          </a>
        </p>
      </div>
    </div>
  </div>

{% endblock %}
